---
- name: Render nginx config from a Jinja2 template
  hosts: webservers
  become: true

  vars:
    nginx_port: 80
    doc_root: /var/www/html
    blocked_paths:
      - /admin
      - /.git

  tasks:
    - name: Push templated config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/sites-available/default
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
