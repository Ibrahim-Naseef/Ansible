---
- name: Deploy a Dockerized application
  hosts: webservers
  become: true

  vars:
    image_name: nginx:latest
    container_name: web_app
    host_port: 8080
    container_port: 80

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
        state: present
        update_cache: true

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: true

    - name: Pull the application image
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: pull

    - name: Run the container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"
